# Signal ingest — runs here because this repo is public.
#
# my-website is private, so GitHub Actions minutes there are metered, not
# free. This repo holds no Signal code of its own: it checks my-website out
# with a read-only, repo-scoped token and runs the exact commands
# my-website's own `.github/workflows/signal-ingest.yml` used to run, against
# the same SIGNAL_DATABASE_URL. Minutes here are free because the *workflow*
# lives in a public repo — what it checks out staying private doesn't affect
# that.
#
# Keep this file's steps in sync with my-website's `signal:migrate` /
# `signal:ingest` scripts if those ever change shape. See my-website's
# docs/signal/PHASE-1.md and .github/workflows/signal-ingest.yml for the full
# design history and why each step exists.

name: Signal ingest

on:
  schedule:
    # Every 15 minutes, deliberately OFF the quarter-hour. The windows
    # decide what gets published, not the cron — see resolveFilingWindow in
    # my-website.
    #
    # GitHub throttles this hard: measured across 29 consecutive firings on
    # 2026-08-25/26, the real gaps were min 21m, median 49m, max 184m. That
    # is the platform's ceiling on a free scheduled trigger and this file
    # cannot raise it.
    #
    # It can, however, stop asking for the worst minutes. GitHub delays
    # scheduled runs when the shared scheduler is loaded, and load is
    # heaviest on round numbers — :00 above all, then :15/:30/:45 — because
    # that is where every hand-written cron in the world points. `*/15` asked
    # for all four. On 2026-08-28 the last scheduled run landed at 00:20Z and
    # the next had still not fired 2h21m later, leaving the brief stuck at
    # 10:11 AEST while two windows passed; a manual dispatch filed 12:00
    # within three minutes, so the runner was healthy and the *trigger* was
    # the thing missing. 7/22/37/52 keeps the same four-per-hour cadence and
    # asks for minutes almost nobody else wants.
    #
    # This is a mitigation, not a fix. The only way to actually guarantee an
    # hourly filing on a free plan is to stop relying on `schedule` at all
    # and drive `workflow_dispatch` from an external scheduler — dispatch
    # events are not throttled. That needs an account this repo does not
    # have; see my-website's docs/signal/HANDOFF.md.
    #
    # It was raised the wrong way once, on 2026-08-27, by making the job
    # loop internally for 50 minutes so one dispatch would cover its whole
    # hour. That backfired badly enough to be worth recording here so nobody
    # tries it again: a job that runs for an hour holds the concurrency
    # group below for an hour, GitHub keeps at most one pending run per
    # group and discards the rest, and the result was three runs in
    # twenty-two hours instead of twenty-five — a fifth of the coverage,
    # with the brief sitting nine hours stale. Short jobs and frequent
    # dispatches beat long jobs and rare ones, because the dispatch is the
    # scarce thing.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the pipeline without publishing a filing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never cancel a run in flight — it may be inside the filing transaction.
  # This is safe precisely because the job is short: a 1-3 minute run almost
  # never has a dispatch land on top of it, so the group is essentially
  # uncontended. Keep it that way.
  group: signal-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Was 12. Actions history showed roughly half of all scheduled runs
    # killed at almost exactly 12m18s with the ingest script mid-run and
    # silent — not crashing, just not finished. 25 gives real runs enough
    # room; a run that is still going at 25 minutes is a hang worth seeing
    # fail loudly rather than a false negative disguised as a race against
    # the clock.
    #
    # A normal run is 1-3 minutes. If this number ever needs to grow past
    # 25 again, the thing to fix is whatever got slow, not this ceiling —
    # and never by keeping the job alive on purpose (see the cron comment).
    timeout-minutes: 25
    env:
      CI: true
      SIGNAL_DATABASE_URL: ${{ secrets.SIGNAL_DATABASE_URL }}
      SIGNAL_EMBEDDER: sentence
      SIGNAL_MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/signal-transformers
      # RFC §16 Phase 1.5. Both secrets must be set on this repo (Settings →
      # Secrets and variables → Actions) for synthesis to actually run —
      # unset, signal:ingest reads the same absence every other provider
      # seam does and files with synthesis_depth: 'none', exactly as before
      # either secret existed.
      SIGNAL_SYNTHESIS_PROVIDER: ${{ secrets.SIGNAL_SYNTHESIS_PROVIDER }}
      SIGNAL_SYNTHESIS_API_KEY: ${{ secrets.SIGNAL_SYNTHESIS_API_KEY }}
      # Optional. Overrides the model `pipeline/synthesis.ts` defaults to, so
      # a vendor quota change is a secret edit rather than a deploy.
      SIGNAL_SYNTHESIS_MODEL: ${{ secrets.SIGNAL_SYNTHESIS_MODEL }}
    steps:
      # Cross-repo checkout: this workflow lives here, but the code it runs
      # lives in the private my-website repo. MY_WEBSITE_PAT is a
      # fine-grained PAT scoped to Contents: Read on my-website only.
      - name: Checkout my-website (private)
        uses: actions/checkout@v6
        with:
          repository: Ritiksharmma/my-website
          token: ${{ secrets.MY_WEBSITE_PAT }}

      - name: Check the database is configured
        id: configured
        run: |
          if [ -z "${SIGNAL_DATABASE_URL}" ]; then
            echo "no SIGNAL_DATABASE_URL secret; skipping the run" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.configured.outputs.ready == 'true'
        run: npm ci

      - name: Apply the schema
        if: steps.configured.outputs.ready == 'true'
        run: npm run signal:migrate

      - name: Cache sentence model weights
        if: steps.configured.outputs.ready == 'true'
        uses: actions/cache@v5
        with:
          path: .cache/signal-transformers
          key: signal-minilm-l6-v2-${{ runner.os }}-v1

      - name: Install sentence model runtime
        if: steps.configured.outputs.ready == 'true'
        run: npm install --no-save @huggingface/transformers@4.2.0

      # One pass, and out. The window decides whether it publishes; most
      # runs publish nothing, which is the design (§14: an arrival moment,
      # not a stream).
      - name: Run ingest
        if: steps.configured.outputs.ready == 'true'
        run: npm run signal:ingest ${{ inputs.dry-run && '-- --dry-run' || '' }}
